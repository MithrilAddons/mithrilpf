plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}"
    id 'org.jetbrains.kotlin.plugin.serialization' version "${kotlin_version}"
    id 'com.diffplug.spotless' version '8.10.2'
    id 'jacoco'
    id 'org.sonarqube' version '7.5.0.8588'
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.terraformersmc.com/releases/'
        content { includeGroup 'com.terraformersmc' }
    }
    maven {
        url = 'https://repo.hypixel.net/repository/Hypixel/'
        content { includeModule 'net.hypixel', 'mod-api' }
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeModule 'maven.modrinth', 'hypixel-mod-api' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    // Required at runtime as the separate Hypixel Mod API mod, which bundles this library.
    compileOnly("net.hypixel:mod-api:${project.hypixel_mod_api_version}") { transitive = false }
    localRuntime "maven.modrinth:hypixel-mod-api:${project.hypixel_mod_api_fabric_version}"
    implementation 'io.nayuki:qrcodegen:1.8.0'
    include 'io.nayuki:qrcodegen:1.8.0'
    testImplementation 'com.google.zxing:core:3.5.4'
    testImplementation "org.jetbrains.kotlin:kotlin-test-junit:${project.kotlin_version}"
}

def officialRelease = System.getenv('GITHUB_ACTIONS') == 'true' &&
    System.getenv('GITHUB_REPOSITORY') == 'MithrilAddons/mithrilpf' &&
    System.getenv('GITHUB_EVENT_NAME') == 'push' &&
    System.getenv('GITHUB_REF_TYPE') == 'tag' &&
    System.getenv('GITHUB_REF_NAME') == "v${project.version}" &&
    System.getenv('GITHUB_WORKFLOW') == 'Release'

processResources {
    inputs.property 'version', project.version
    inputs.property 'officialRelease', officialRelease
    filesMatching('fabric.mod.json') { expand version: project.version }
    filesMatching('assets/mithrilpf/build.properties') {
        expand version: project.version, officialRelease: officialRelease
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
sourceSets {
    updater {}
    releaseTools {
        java { srcDirs = ['tools']; include '**/ReleaseSigning.java' }
    }
    test {
        compileClasspath += sourceSets.updater.output
        runtimeClasspath += sourceSets.updater.output
        compileClasspath += sourceSets.releaseTools.output
        runtimeClasspath += sourceSets.releaseTools.output
    }
}
tasks.register('updaterJar', Jar) {
    from sourceSets.updater.output
    archiveFileName = 'updater.jar'
    destinationDirectory = layout.buildDirectory.dir('updater')
    manifest { attributes 'Main-Class': 'dev.mithril.mithrilpf.update.UpdateInstaller' }
}
processResources {
    from(tasks.named('updaterJar')) { into 'assets/mithrilpf' }
}
sourcesJar { from sourceSets.updater.allSource }
kotlin { compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_25 } }
tasks.withType(JavaCompile).configureEach { options.release = 25 }

jacoco { toolVersion = '0.8.15' }
jacocoTestReport {
    dependsOn test
    sourceSets sourceSets.main, sourceSets.updater, sourceSets.releaseTools
    reports {
        xml.required = true
        html.required = true
    }
}
test { finalizedBy jacocoTestReport }

sonar {
    properties {
        property 'sonar.projectKey', 'MithrilAddons_mithrilpf'
        property 'sonar.organization', 'mithriladdons'
        property 'sonar.sourceEncoding', 'UTF-8'
        property 'sonar.sources', 'src/main,src/updater,tools,.github,build.gradle,settings.gradle,gradle/verification-metadata.xml'
        property 'sonar.tests', 'src/test,tools/tests'
        property 'sonar.exclusions', 'src/main/resources/assets/mithrilpf/icon.png,tools/tests/**'
        // Minecraft widgets are verified in-game; headless state and input logic stay measured.
        // Layout maths these use lives in tested classes (FinderLayout, GamesLayout, RecordsData).
        def untestedUi = [
            'FinderAvatar.kt',          // looks up skins the game already knows and draws them
            'FinderBrowse.kt',          // builds the Parties page widgets
            'FinderControls.kt',        // small widget builders shared by finder pages
            'FinderEditor.kt',          // builds the listing editor widgets
            'FinderHud.kt',             // draws the finder HUD line
            'FinderListingPreview.kt',  // draws the listing preview card
            'FinderNotifications.kt',   // prints finder notices to chat and plays sounds
            'FinderPartyRow.kt',        // draws one party row
            'FinderPartyView.kt',       // builds the Your party page widgets
            'FinderReportScreen.kt',    // the report dialog
            'FinderSprites.kt',         // draws role sprites
            'FinderTabButton.kt',       // draws a tab button
            'GamesScreen.kt',           // draws the Games screen
            'PartyFinderScreen.kt',     // the finder screen and its Records drawing
            'SettingToggle.kt',         // draws a settings toggle
            'UpdateOptInScreen.kt',     // the first-launch update question
            'UpdatePromptScreen.kt',    // the update prompt
        ]
        property 'sonar.coverage.exclusions', untestedUi.collect { "src/main/kotlin/dev/mithril/mithrilpf/ui/$it" }.join(',')
        property 'sonar.java.binaries', files(sourceSets.main.output.classesDirs, sourceSets.updater.output.classesDirs, sourceSets.releaseTools.output.classesDirs)
        property 'sonar.coverage.jacoco.xmlReportPaths', 'build/reports/jacoco/test/jacocoTestReport.xml'
        property 'sonar.python.version', '3.14'
        property 'sonar.python.coverage.reportPaths', 'build/reports/python/coverage.xml'
    }
}
tasks.named('sonar') { dependsOn jacocoTestReport }

spotless {
    java {
        target 'src/**/*.java', 'tools/**/*.java'
        googleJavaFormat('1.36.1').aosp()
    }
    kotlin {
        target 'src/**/*.kt'
        ktfmt('0.64').kotlinlangStyle()
    }
    format 'supportFiles', {
        target '*.md', '*.gradle', '*.properties', '.editorconfig', '.gitignore', '.gitattributes',
            'docs/**/*.md', '.github/**/*.yml', '.github/**/*.md', 'tools/**/*.py'
        trimTrailingWhitespace()
        endWithNewline()
    }
}

tasks.withType(Test).configureEach {
    useJUnit()
    environment 'APPDATA', layout.buildDirectory.dir('test-home/appdata').get().asFile.absolutePath
    environment 'LOCALAPPDATA', layout.buildDirectory.dir('test-home/localappdata').get().asFile.absolutePath
    environment 'HYPIXEL_API_KEY', ''
    systemProperty 'user.home', layout.buildDirectory.dir('test-home').get().asFile.absolutePath
    testLogging { events 'failed', 'skipped'; exceptionFormat = 'full' }
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.withType(Jar).configureEach {
    from('LICENSE') { into 'META-INF/licenses'; rename { 'LICENSE_mithrilpf' } }
}
jar {
    from('THIRD_PARTY_NOTICES.md') { into 'META-INF' }
    from('LICENSES') { into 'META-INF/licenses' }
}
