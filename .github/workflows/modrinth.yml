name: Publish to Modrinth

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub release tag to upload or retry
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: modrinth-publishing
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'MithrilAddons/mithrilpf'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Upload published release
        env:
          GH_TOKEN: ${{ github.token }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID || 'mithrilpf' }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: python -m tools.publish_modrinth
