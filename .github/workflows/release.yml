name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/build.yml
  draft:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '25'
          distribution: temurin
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Validate tag and main ancestry
        run: python tools/versioning.py
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: mod-ubuntu-24.04
          path: release
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: reports-ubuntu-24.04
          path: release-reports
      - name: Sign tested release artifact
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          artifact="release/mithrilpf-${version}.jar"
          java tools/ReleaseSigning.java sign "$version" "$artifact" "$artifact.sig" src/main/resources/assets/mithrilpf/release-signing.pub
      - name: Create draft from tested artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          artifact="mithrilpf-${version}.jar"
          test -f "release/$artifact"
          java tools/ReleaseSigning.java verify "$version" "release/$artifact" "release/$artifact.sig" src/main/resources/assets/mithrilpf/release-signing.pub
          (cd release && sha256sum "$artifact" > SHA256SUMS)
          python -m tools.release_notes
          notes="release/notes.md"
          args=(--draft --verify-tag --notes-file "$notes" --title "MithrilPF $version")
          if [[ "$version" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "release/$artifact" "release/$artifact.sig" release/SHA256SUMS "${args[@]}"
